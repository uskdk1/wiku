# wiku 자체 확인: 실행기 문법 + 패치 없는 staging 변형 빌드 (wine 은 cache.nixos.org 에서 받아서 빠르다)
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: 실행기 문법
        run: bash -n bin/wiku

      - name: staging 변형 빌드
        run: |
          nix build --print-build-logs .#staging
          ./result/bin/wiku list
          ./result/bin/wiku wines
